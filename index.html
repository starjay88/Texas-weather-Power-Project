<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Weather & Power Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9;}
        .chart-container { width: 80%; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);}
    </style>
</head>
<body>

    <h1>⚡ Texas Weather & Power Demand Dashboard 🌡️</h1>
    <p>Real-time correlation between temperature and power demand.</p>

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <script>
        // 1. 백엔드 API 주소 (정확한 /api/forecast 경로)
        const apiUrl = 'https://texas-weather-power-project.onrender.com/api/forecast'; 

        fetch(apiUrl)
            .then(response => response.json())
            .then(responseData => {
                // 2. 포장지(data) 한 겹 벗기기
                const realData = responseData.data; 

                // 3. 시간 예쁘게 다듬기 (UTC -> 현지 시간 변환 및 MM/DD HH:MM 포맷)
                const labels = realData.map(item => {
                    const dt = new Date(item.time); 
                    const month = dt.getMonth() + 1;
                    const date = dt.getDate();
                    const hours = String(dt.getHours()).padStart(2, '0');
                    const minutes = String(dt.getMinutes()).padStart(2, '0');
                    return `${month}/${date} ${hours}:${minutes}`;
                });
                
                // 4. 온도와 전력 데이터 가져오기 (전력 컬럼 이름 electricity_demand_mwh 적용!)
                const temps = realData.map(item => item.temperature);
                const powers = realData.map(item => item.electricity_demand_mwh);

                // 5. 차트 그리기
                const ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'Temperature (F)', data: temps, borderColor: 'red', yAxisID: 'y' },
                            { label: 'Power Demand (MWh)', data: powers, borderColor: 'blue', yAxisID: 'y1' }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { type: 'linear', display: true, position: 'left', title: {display: true, text: 'Temperature (F)'} },
                            y1: { type: 'linear', display: true, position: 'right', title: {display: true, text: 'Power Demand (MWh)'} }
                        }
                    }
                });
            })
            .catch(error => console.error('Error fetching data:', error));
    </script>
</body>
</html>
